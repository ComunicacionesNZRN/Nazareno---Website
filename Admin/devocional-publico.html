<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Devocional | Iglesia del Nazareno Cali</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #141414; --paper: #f6f3ed; --muted: #706d68; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Sora", sans-serif; font-weight: 400; }
      .devocional { max-width: 760px; margin: 0 auto; padding: 64px 22px 96px; }
      .devocional-media { margin: 0; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 14px; background: #e9e5dd; }
      .devocional-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .devocional-titulo { margin: 30px 0 10px; font-weight: 700; font-size: clamp(28px, 4.4vw, 44px); line-height: 1.12; letter-spacing: -0.6px; }
      .devocional-fecha { margin: 0 0 32px; color: var(--muted); font-size: 13px; font-weight: 400; }
      .devocional-texto { font-weight: 400; font-size: 17px; line-height: 1.85; }
      .devocional-texto p { margin: 0 0 1.25em; }
      .devocional-estado { color: var(--muted); font-size: 14px; }
    </style>
  </head>
  <body>
    <article class="devocional" data-devocional>
      <p class="devocional-estado">Cargando devocional...</p>
    </article>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase-client.js"></script>
    <script>
      const container = document.querySelector("[data-devocional]");
      const client = window.supabaseAdmin?.client || window.supabaseClient;

      const escapeHtml = (value = "") => String(value).replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[character]);
      const formatPublicDate = (value) => new Intl.DateTimeFormat("es-CO", { day: "numeric", month: "long", year: "numeric" }).format(new Date(value));
      const toParagraphs = (text = "") => text.split(/\n{2,}|\n/).filter(Boolean).map((line) => `<p>${escapeHtml(line)}</p>`).join("");

      const render = (item) => {
        container.innerHTML = `
          ${item.imagen_url ? `<figure class="devocional-media"><img src="${escapeHtml(item.imagen_url)}" alt="${escapeHtml(item.imagen_alt || item.titulo)}" /></figure>` : ""}
          <h1 class="devocional-titulo">${escapeHtml(item.titulo)}</h1>
          <p class="devocional-fecha">Publicado el ${escapeHtml(formatPublicDate(item.publicar_at))}</p>
          <div class="devocional-texto">${toParagraphs(item.contenido)}</div>
        `;
      };

      (async () => {
        try {
          const id = new URLSearchParams(window.location.search).get("id");
          let query = client
            .from("devocionales")
            .select("id, titulo, contenido, imagen_url, imagen_alt, publicar_at")
            .eq("publicado", true)
            .lte("publicar_at", new Date().toISOString())
            .order("publicar_at", { ascending: false })
            .limit(1);
          if (id) query = client.from("devocionales").select("id, titulo, contenido, imagen_url, imagen_alt, publicar_at").eq("id", id).eq("publicado", true).lte("publicar_at", new Date().toISOString()).limit(1);
          const { data, error } = await query;
          if (error) throw error;
          if (!data?.length) { container.innerHTML = '<p class="devocional-estado">Aún no hay un devocional publicado. Vuelve pronto.</p>'; return; }
          render(data[0]);
        } catch (error) {
          container.innerHTML = `<p class="devocional-estado">No fue posible cargar el devocional: ${escapeHtml(error.message)}</p>`;
        }
      })();
    </script>
  </body>
</html>
